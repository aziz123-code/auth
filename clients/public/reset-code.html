<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сброс пароля | YTPro Market</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Введите код</h1>
      <p class="text-gray-500 mt-2"> Код отправлен вам на почту 
        <span id="email-text" class="font-bold"></span>
      </p>
    </div>

    <form id="reset-code-form" class="space-y-5">
     <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Код</label>

  <div id="code-inputs" class="flex justify-between gap-2">
    <input type="text" maxlength="1" class="code-box w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" />
    <input type="text" maxlength="1" class="code-box w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" />
    <input type="text" maxlength="1" class="code-box w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" />
    <input type="text" maxlength="1" class="code-box w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" />
    <input type="text" maxlength="1" class="code-box w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" />
    <input type="text" maxlength="1" class="code-box w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" />
  </div>
</div>

<div class="text-center mt-3">
  <p class="text-gray-500 text-sm mb-2">
    Время до истечения кода: <span id="timer">02:00</span>
  </p>

  <button type="submit" id="resendBtn"
    class="hidden bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 text-sm rounded-full transition flex items-center justify-center mx-auto">
    <span class="btn-text">Отправить код заново</span>
    <svg class="spinner hidden animate-spin h-6 w-6 ml-1 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
  </button>
</div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/script.js"></script>
</body>
</html>
