<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация | YTPro Market</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Регистрация в YTPro Market</h1>
      <p class="text-gray-500 mt-2">Создайте аккаунт, чтобы начать работу с YTPro услугами</p>
    </div>

    <form id="register-form" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
      </div>

      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
        <input type="text" id="username" name="username" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
        <input type="password" id="password" name="password" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
      </div>

      <div>
        <label for="confirm" class="block text-sm font-medium text-gray-700 mb-1">Подтверждение пароля</label>
        <input type="password" id="confirm-password" name="confirm" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
      </div>

      <button type="submit" id="register-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg transition flex items-center justify-center">
        <span class="btn-text">Зарегистрироваться</span>
        <svg class="spinner hidden animate-spin h-5 w-5 ml-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
      </button>
      
    </form>

    <div class="text-center mt-6">
      <p class="text-sm text-gray-600">
        Уже есть аккаунт?
        <a href="login" class="text-red-600 font-semibold hover:underline">Войти</a>
      </p>
    </div>
    <div class="text-center mt-4">
  <a href="/api/oauth/google"
     class="inline-flex items-center justify-center w-full max-w-xs mx-auto bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 font-semibold py-2 rounded-lg transition">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="h-5 mr-2">
    Войти через Google
  </a>
</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/script.js"></script>
</body>
</html>
